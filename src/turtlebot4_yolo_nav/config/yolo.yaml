yolo_detector:
  ros__parameters:
    use_sim_time: true
    image_topic: /rgbd_camera/image
    annotated_topic: /yolo/annotated_image
    detections_topic: /yolo/detections
    model: yolo11n.pt
    confidence: 0.25
    iou: 0.45
    image_size: 640
    inference_hz: 3.0
    device: cpu
    show_window: true
    log_interval: 1.0

